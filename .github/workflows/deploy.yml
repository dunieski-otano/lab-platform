name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write      # lets the job request an OIDC token
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "fmt, validate, test and plan run here"
  deploy-prod:
    needs: checks
    runs-on: ubuntu-latest
    environment: prod  # pauses for the required reviewer
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::639916808497:role/gha-prod-deploy  # the role whose trust policy you wrote
          aws-region: us-east-1
      - run: aws sts get-caller-identity
      - name: Show OIDC claims (debug, remove after)
        run: |
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          P=$(echo "$RESP" | jq -r .value | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "$P" | base64 -d | jq '{sub, aud, repository, environment, ref}'