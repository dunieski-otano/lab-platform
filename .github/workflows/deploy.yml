name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write      # lets the job request an OIDC token
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "fmt, validate, test and plan run here"
  deploy-prod:
    needs: checks
    runs-on: ubuntu-latest
    environment: prod  # pauses for the required reviewer
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::639916808497:role/gha-prod-deploy  # the role whose trust policy you wrote
          aws-region: us-east-1
      - run: aws sts get-caller-identity